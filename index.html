<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Nebulosa de Liderazgo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050812;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ===== INFO SUPERIOR ===== */
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
            user-select: none;
        }

        #info h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(90deg, #64b5f6, #e8a838, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        #info small {
            display: block;
            font-size: 12px;
            -webkit-text-fill-color: #8899bb;
        }

        #container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            padding-top: 80px;
            box-sizing: border-box;
        }

        #galaxy-container {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at center, #0a0e1a, #050812);
            overflow: hidden;
        }

        #galaxy-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===== CONTROLES ===== */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .controls button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccd;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .controls .zoom-level {
            color: #556688;
            font-size: 13px;
            padding: 6px 10px;
        }

        /* ===== LEYENDA ===== */
        .legend {
            position: absolute;
            right: 24px;
            bottom: 100px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 14px 18px;
            border-radius: 14px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ccd;
            font-size: 12px;
            margin: 4px 0;
        }

        .legend-item .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }
        .legend-item .dot.azul { background: #2a6f97; box-shadow: 0 0 12px rgba(42,111,151,0.4); }
        .legend-item .dot.rojo { background: #c73e3e; box-shadow: 0 0 12px rgba(199,62,62,0.4); }
        .legend-item .dot.amarillo { background: #e8a838; box-shadow: 0 0 12px rgba(232,168,56,0.4); }
        .legend-item .dot.verde { background: #3a8c5a; box-shadow: 0 0 12px rgba(58,140,90,0.4); }

        #stats {
            position: absolute;
            bottom: 90px;
            left: 24px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        // ============================================================

        // 🔑 TU URL DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzIG506XO2hGz4xL90AmVQnqDN1zeKVjLp1RSMs6W4SyMZmlFPaqQoKCsPzLv396quW/exec';

        let galaxyParticles = [];

        const colorMap = { 'Azul': '#2a6f97', 'Rojo': '#c73e3e', 'Amarillo': '#e8a838', 'Verde': '#3a8c5a' };
        const colorHex = { 'Azul': 0x2a6f97, 'Rojo': 0xc73e3e, 'Amarillo': 0xe8a838, 'Verde': 0x3a8c5a };

        const exampleData = [

            { nombre: "Wilson González Pinto", proceso: "Logistica", cargo: "Jefe de Logistica", principal: "Verde", secundario: "Azul" },

            { nombre: "Gloria Liliana Osorio Avendaño", proceso: "Calidad Administrativa y Financiera", cargo: "Directora de Calidad Administrativa y Financiera", principal: "Rojo", secundario: "Azul" },
            { nombre: "Melisa Toscano Palomino", proceso: "Calidad Administrativa y Financiera", cargo: "Profesional de Apoyo", principal: "Rojo", secundario: "Amarillo" },
            { nombre: "Liliana Jimena Naranjo Cepeda", proceso: "Credito y Cartera", cargo: "Jefe Credito y Cartera", principal: "Rojo", secundario: "Amarillo" },
            { nombre: "Diana Alejandra Gómez Pedraza", proceso: "Presupuesto", cargo: "Jefe de Presupuesto", principal: "Rojo", secundario: "Verde" },
            { nombre: "Sergio Urbano Contreras", proceso: "Planta Fisica", cargo: "Jefe de Planta Fisica", principal: "Rojo", secundario: "Azul" },
            { nombre: "Oscar Alfonso Larrota Roa", proceso: "Seguridad Informática", cargo: "Jefe Seguridad Informática", principal: "Rojo", secundario: "Amarillo" },
            { nombre: "Jorge García Rojas", proceso: "Servicio a Usuario", cargo: "Jefe Servicio a Usuario", principal: "Azul", secundario: "Rojo" }

        // ============================================================
        //  FUNCIÓN PARA CARGAR DATOS
        // ============================================================
        async function loadData() {
            try {
                // Intentar conexión directa primero
                let url = SCRIPT_URL + '?t=' + Date.now();
                console.log('🔗 Intentando conexión directa:', url);

                let response = await fetch(url, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate'
                    }
                });

                // Si falla, intentar con proxy
                if (!response.ok) {
                    console.log('🔄 Conexión directa falló, usando proxy...');
                    useProxy = true;
                    const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(SCRIPT_URL);
                    url = proxyUrl + '&t=' + Date.now();
                    response = await fetch(url, {
                        cache: 'no-cache',
                        headers: {
                            'Cache-Control': 'no-cache, no-store, must-revalidate'
                        }
                    });
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const text = await response.text();
                console.log('📄 Respuesta recibida (primeros 100 caracteres):', text.substring(0, 100));

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('No es JSON válido');
                }

                // Verificar si hay error
                if (data && data.error) {
                    throw new Error(data.error);
                }

                // Extraer datos
                let rows = data;
                if (data.data && Array.isArray(data.data)) {
                    rows = data.data;
                } else if (data.success && data.data) {
                    rows = data.data;
                }

                if (!rows || rows.length === 0) {
                    throw new Error('No hay datos');
                }

                // Mapear datos
                const newData = rows.map(row => ({
                    nombre: row.Nombre || row.nombre || '',
                    proceso: row['Proceso/Subproceso'] || row.proceso || row['Proceso'] || '',
                    cargo: row.Cargo || row.cargo || '',
                    campus: row.Campus || row.campus || '',
                    principal: row['LIDERAZGO PRINCIPAL'] || row.principal || row['Principal'] || '',
                    secundario: row['LIDERAZGO SECUNDARIO'] || row.secundario || row['Secundario'] || ''
                })).filter(l => l.nombre !== '' && l.principal !== '');

                if (newData.length === 0) {
                    throw new Error('No hay datos válidos');
                }

                leadersData = newData;
                console.log(`✅ ${leadersData.length} líderes cargados`);

                // Actualizar UI
                document.getElementById('leaderCount').textContent = leadersData.length;
                document.getElementById('stats').innerHTML = `🌟 Líderes: <span id="leaderCount">${leadersData.length}</span> · ✅ Conectado`;

                // Regenerar galaxia
                regenerateGalaxy();

            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('stats').innerHTML = `🌟 Líderes: <span id="leaderCount">${leadersData.length || 0}</span> · ⚠️ Sin conexión (usando datos de ejemplo)`;

                // Usar datos de ejemplo
                if (leadersData.length === 0) {
                    leadersData = exampleData;
                    document.getElementById('leaderCount').textContent = leadersData.length;
                    regenerateGalaxy();
                }
            }
        }

        // ============================================================
        //  INICIALIZAR THREE.JS
        // ============================================================
        function initThreeJS() {
            const container = document.getElementById('galaxy-container');
            const canvas = document.getElementById('galaxyCanvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050812);

            const w = container.clientWidth;
            const h = container.clientHeight;

            camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 1000);
            camera.position.set(6, 4, 10);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;
            controls.maxDistance = 20;
            controls.minDistance = 2;
            controls.target.set(0, 0, 0);

            // Crear galaxia de fondo
            createGalaxy();

            // Crear líderes
            createLeaders();

            // Eventos
            window.addEventListener('resize', onResize);

            animate();
        }

        // ============================================================
        //  CREAR GALAXIA DE FONDO
        // ============================================================
        function createGalaxy() {
            const count = 4000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const radius = 0.5 + Math.pow(Math.random(), 0.7) * 4.5;
                const angle = radius * 2.5 + Math.random() * 0.5;
                const scatter = 0.05 + radius * 0.03;
                const height = (Math.random() - 0.5) * (0.4 + radius * 0.04);

                positions[i3] = Math.cos(angle) * radius + (Math.random() - 0.5) * scatter;
                positions[i3 + 1] = height * 1.5;
                positions[i3 + 2] = Math.sin(angle) * radius + (Math.random() - 0.5) * scatter;

                const brightness = 0.3 + Math.random() * 0.7;
                const temp = Math.random();
                if (temp < 0.5) {
                    colors[i3] = 0.6 * brightness;
                    colors[i3 + 1] = 0.7 * brightness;
                    colors[i3 + 2] = 1.0 * brightness;
                } else {
                    colors[i3] = 1.0 * brightness;
                    colors[i3 + 1] = 0.8 * brightness;
                    colors[i3 + 2] = 0.5 * brightness;
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.1, 'rgba(255,255,255,0.8)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);

            const mat = new THREE.PointsMaterial({
                size: 0.06,
                map: texture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                vertexColors: true,
                sizeAttenuation: true,
                opacity: 0.7
            });

            const stars = new THREE.Points(geo, mat);
            scene.add(stars);
        }

        // ============================================================
        //  CREAR LÍDERES
        // ============================================================
        function createLeaders() {
            if (allLeaderObjects.length > 0) {
                allLeaderObjects.forEach(obj => {
                    if (obj.group.parent) {
                        obj.group.parent.remove(obj.group);
                    }
                });
                allLeaderObjects = [];
                leaderMeshes = [];
            }

            const numLeaders = leadersData.length;
            if (numLeaders === 0) return;

            const positions = [];
            for (let i = 0; i < numLeaders; i++) {
                const t = (i / numLeaders) * 0.9 + 0.05;
                const angle = t * Math.PI * 5 + (i % 3) * Math.PI * 2 / 3;
                const radius = 0.5 + t * 3.5;
                const scatter = 0.02 + t * 0.02;
                const heightOffset = (Math.random() - 0.5) * 0.3;
                positions.push({
                    x: Math.cos(angle) * radius + (Math.random() - 0.5) * scatter,
                    z: Math.sin(angle) * radius + (Math.random() - 0.5) * scatter,
                    y: heightOffset + Math.sin(angle * 2) * 0.1
                });
            }

            leadersData.forEach((leader, idx) => {
                const pos = positions[idx] || { x: 0, y: 0, z: 0 };
                const color = colorHex[leader.principal] || 0x888888;

                const group = new THREE.Group();

                const sphereGeo = new THREE.SphereGeometry(0.15, 16, 16);
                const sphereMat = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.5,
                    metalness: 0.1,
                    roughness: 0.2
                });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                sphere.userData = { leader: leader, idx: idx };
                group.add(sphere);

                const ringColor = colorHex[leader.secundario] || 0x888888;
                const ringGeo = new THREE.RingGeometry(0.17, 0.20, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: ringColor,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.5,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.y = 0;
                ring.lookAt(0, 0, 0);
                group.add(ring);

                group.position.set(pos.x, pos.y, pos.z);
                scene.add(group);

                allLeaderObjects.push({
                    group: group,
                    sphere: sphere,
                    ring: ring,
                    leader: leader,
                    idx: idx
                });

                leaderMeshes.push(sphere);
            });
        }

        // ============================================================
        //  REGENERAR GALAXIA
        // ============================================================
        function regenerateGalaxy() {
            createLeaders();
        }

        // ============================================================
        //  CONTROLES
        // ============================================================
        function resetView() {
            camera.position.set(6, 4, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function toggleRotation() {
            isRotating = !isRotating;
            controls.autoRotate = isRotating;
            document.querySelector('.controls button:nth-child(2)').textContent = isRotating ? '⏸ Pausar' : '▶ Reanudar';
        }

        // ============================================================
        //  ANIMACIÓN
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            allLeaderObjects.forEach((obj, idx) => {
                if (obj.ring) {
                    obj.ring.rotation.x += 0.01;
                    obj.ring.rotation.y += 0.015;
                }
            });

            renderer.render(scene, camera);
        }

        // ============================================================
        //  RESIZE
        // ============================================================
        function onResize() {
            const container = document.getElementById('galaxy-container');
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        // ============================================================
        //  INICIO
        // ============================================================
        window.onload = function() {
            initThreeJS();
            loadData();
        };

        window.resetView = resetView;
        window.toggleRotation = toggleRotation;
        window.loadData = loadData;
    </script>
</body>
